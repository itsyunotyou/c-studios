name: Process library images

# The publish endpoint (functions/api/publish-library.js) commits new rows
# plus their raw images staged under _incoming/<category>/ — it can't do the
# actual image processing itself (Cloudflare Pages Functions can't run sharp).
# This runs the same processing script used for local/manual additions,
# generating the derived thumb/large webp files + dominant color, then
# commits the result and cleans up the raw. If nothing under _incoming/
# needed processing, this exits without committing (safe against re-triggering
# itself in a loop).
on:
  push:
    branches: [main]
    paths:
      - '_incoming/**'

permissions:
  contents: write

concurrency:
  group: process-library-images
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/prepare-library-images.mjs

      - name: Commit processed images, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/library-text.json src/data/library-image.json src/data/library-sound.json public/images/library _incoming
          if git diff --cached --quiet; then
            echo "Nothing to process — no commit."
            exit 0
          fi
          git commit -m "Process staged library images [skip ci]"

          # The publish endpoint commits straight to main via the GitHub API
          # for every staged image, completely outside this workflow — the
          # concurrency group above only serializes against other runs of
          # THIS workflow, not those. A burst of those commits landing while
          # this job was busy in npm ci / the processing script means main
          # has very likely moved on by now, so a plain push would reject as
          # non-fast-forward. Rebase onto whatever's current and retry.
          for i in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "Still couldn't push after 5 attempts."
          exit 1
